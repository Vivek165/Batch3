<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Monitoring Demo{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="{{ url_for('main.home') }}">Pulse<span>Monitor</span></a>
      <nav class="nav" aria-label="Main">
        <a href="{{ url_for('main.dashboard') }}" class="{% if request.endpoint == 'main.dashboard' %}active{% endif %}">Dashboard</a>
        <a href="{{ url_for('main.manage_servers') }}" class="{% if request.endpoint == 'main.manage_servers' %}active{% endif %}">Manage servers</a>
        <a href="{{ url_for('main.home') }}" class="nav-muted">Login (soon)</a>
      </nav>
    </header>

    <main class="content">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <p>Local demo — binds to <code>0.0.0.0:5777</code>. Auth and agent token required in later phases.</p>
    </footer>
  </div>
</body>
</html>
